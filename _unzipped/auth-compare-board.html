<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth Compare Board — NEBULA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <style>
    :root{
      --surface:#120c2b;
      --surface-2:#21184a;
      --surface-3:#2c2060;
      --line:rgba(255,255,255,.12);
      --text:#fbf8ff;
      --muted:rgba(251,248,255,.66);
      --pass:#59d99f;
      --blocked:#ffd06e;
      --violet:#8c70ff;
      --viewport-w:1280px;
      --viewport-h:855px;
      --scale:.5;
      --shadow:0 26px 80px rgba(5,3,18,.4);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Manrope",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 18% 12%,rgba(140,112,255,.26),transparent 24%),
        radial-gradient(circle at 84% 10%,rgba(255,208,110,.09),transparent 18%),
        linear-gradient(180deg,#140d30 0%,#080610 100%);
    }
    .app{min-height:100%;padding:16px;display:grid;grid-template-rows:auto auto 1fr;gap:12px}
    .bar,.controls,.pane{
      border:1px solid var(--line);
      background:linear-gradient(145deg,rgba(34,25,76,.94),rgba(14,10,34,.9));
      box-shadow:var(--shadow);
    }
    .bar{border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    h1{margin:0 0 7px;font-size:25px;line-height:1.05;font-weight:780}
    p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .meta{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
    .pill,.tab,.bp{
      display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 11px;
      border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.055);
      color:var(--text);font:inherit;font-size:12px;font-weight:760;text-decoration:none;white-space:nowrap;
    }
    .pill--pass{color:var(--pass);border-color:rgba(89,217,159,.32);background:rgba(89,217,159,.12)}
    .pill--blocked{color:var(--blocked);border-color:rgba(255,208,110,.35);background:rgba(255,208,110,.12)}
    .controls{border-radius:16px;padding:11px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .group{display:flex;flex-wrap:wrap;gap:7px}
    button{cursor:pointer}
    .tab[aria-pressed="true"],.bp[aria-pressed="true"]{background:rgba(140,112,255,.24);border-color:rgba(140,112,255,.45)}
    .board{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .pane{min-width:0;min-height:0;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
    .pane-head{min-height:58px;padding:11px 13px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.04)}
    .pane-head h2{margin:0 0 4px;font-size:15px;line-height:1.15}
    .stage{
      flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;
      background:radial-gradient(circle at 34% 18%,rgba(140,112,255,.15),transparent 22%),#100b25;
    }
    .viewport{
      position:absolute;left:50%;top:50%;width:var(--viewport-w);height:var(--viewport-h);
      transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center;
      border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.38);
    }
    .viewport::after{
      content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.32;mix-blend-mode:screen;
      background-image:
        linear-gradient(rgba(140,112,255,.18) 1px,transparent 1px),
        linear-gradient(90deg,rgba(140,112,255,.18) 1px,transparent 1px);
      background-size:80px 80px,80px 80px;
    }
    .viewport iframe,.viewport img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
    .viewport img{object-fit:contain;background:#130f29}
    .empty{
      width:min(520px,calc(100% - 28px));padding:18px;border:1px dashed rgba(255,208,110,.38);
      border-radius:16px;background:rgba(255,208,110,.09);color:var(--blocked);
    }
    .empty b{display:block;margin-bottom:8px;color:#ffe4a3;font-size:15px}
    .empty code{color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;padding:2px 6px}
    .commands{display:grid;gap:7px;margin-top:11px;color:var(--muted)}
    @media (max-width:1050px){
      .bar,.controls{flex-direction:column;align-items:flex-start}
      .meta{justify-content:flex-start}
      .board{grid-template-columns:1fr}
      .pane{min-height:520px}
    }
  </style>
</head>
<body>
<main class="app">
  <section class="bar">
    <div>
      <h1>Auth Compare Board</h1>
      <p>Эталон и live-верстка в одной панели. Для экранов без настоящего Figma reference панель показывает blocked state, а не подставной эталон.</p>
    </div>
    <div class="meta" id="screenMeta"></div>
  </section>

  <section class="controls" aria-label="Compare controls">
    <div class="group" id="screenTabs"></div>
    <div class="group" id="breakpointTabs"></div>
  </section>

  <section class="board" aria-label="Reference and implementation comparison">
    <article class="pane">
      <div class="pane-head">
        <div>
          <h2>Эталон</h2>
          <p id="referenceLabel">Figma reference</p>
        </div>
        <span class="pill" id="referenceStatus">ref</span>
      </div>
      <div class="stage" id="referenceStage"></div>
    </article>
    <article class="pane">
      <div class="pane-head">
        <div>
          <h2>Моя верстка</h2>
          <p id="liveLabel">Live implementation</p>
        </div>
        <span class="pill" id="liveStatus">live</span>
      </div>
      <div class="stage" id="liveStage"></div>
    </article>
  </section>
</main>

<script>
  const breakpoints = [
    { key: "1200", label: "1200+", w: 1280, h: 855 },
    { key: "992", label: "992", w: 992, h: 800 },
    { key: "768", label: "768", w: 768, h: 800 },
    { key: "576", label: "576", w: 576, h: 800 },
    { key: "390", label: "390", w: 390, h: 844 },
    { key: "320", label: "320", w: 320, h: 760 }
  ];

  const screens = [
    {
      key: "login",
      label: "LOG in",
      page: "login.html",
      status: "source ready",
      statusClass: "pill--pass",
      node: "366:1100",
      refs: {
        "1200": "img/login-figma-reference.png",
        "992": "visual-review/auth-login-forgot-final-human-ready-20260506-045/login-960x855-reference.png",
        "768": "visual-review/auth-login-forgot-final-human-ready-20260506-045/login-640x855-reference.png",
        "576": "visual-review/auth-login-forgot-final-human-ready-20260506-045/login-480x700-reference.png",
        "390": "visual-review/auth-login-forgot-final-human-ready-20260506-045/login-320x700-reference.png",
        "320": "visual-review/auth-login-forgot-final-human-ready-20260506-045/login-320x700-reference.png"
      },
      live: {
        "992": "capture-auth-frame.html?page=login.html&w=960&h=855",
        "768": "capture-auth-frame.html?page=login.html&w=640&h=855",
        "576": "capture-auth-frame.html?page=login.html&w=480&h=700",
        "390": "capture-auth-frame.html?page=login.html&w=320&h=700",
        "320": "capture-auth-frame.html?page=login.html&w=320&h=700"
      },
      viewports: {
        "992": { w: 960, h: 855 },
        "768": { w: 640, h: 855 },
        "576": { w: 480, h: 700 },
        "390": { w: 320, h: 700 },
        "320": { w: 320, h: 700 }
      },
      proof: "pass, bbox h=1"
    },
    {
      key: "forgot",
      label: "FORGOT PASSWORD",
      page: "auth-forgot-new.html",
      status: "source ready",
      statusClass: "pill--pass",
      node: "375:1160",
      refs: {
        "1200": "img/forgot-export-raster.png",
        "992": "visual-review/auth-login-forgot-final-human-ready-20260506-045/forgot-960x855-reference.png",
        "768": "visual-review/auth-login-forgot-final-human-ready-20260506-045/forgot-640x855-reference.png",
        "576": "visual-review/auth-login-forgot-final-human-ready-20260506-045/forgot-480x640-reference.png",
        "390": "visual-review/auth-login-forgot-final-human-ready-20260506-045/forgot-320x640-reference.png",
        "320": "visual-review/auth-login-forgot-final-human-ready-20260506-045/forgot-320x640-reference.png"
      },
      live: {
        "992": "capture-auth-frame.html?page=auth-forgot-new.html&w=960&h=855",
        "768": "capture-auth-frame.html?page=auth-forgot-new.html&w=640&h=855",
        "576": "capture-auth-frame.html?page=auth-forgot-new.html&w=480&h=640",
        "390": "capture-auth-frame.html?page=auth-forgot-new.html&w=320&h=640",
        "320": "capture-auth-frame.html?page=auth-forgot-new.html&w=320&h=640"
      },
      viewports: {
        "992": { w: 960, h: 855 },
        "768": { w: 640, h: 855 },
        "576": { w: 480, h: 640 },
        "390": { w: 320, h: 640 },
        "320": { w: 320, h: 640 }
      },
      proof: "pass, bbox 0"
    },
    {
      key: "signup-create",
      label: "Sign in CREATE",
      page: "signup-step-1.html",
      status: "source ready",
      statusClass: "pill--pass",
      node: "local source-lineage",
      refs: {
        "1200": "visual-review/auth-signup-step1-all-baseline-20260507/signup-step-1-1280x855-reference.png",
        "992": "visual-review/auth-signup-step1-all-baseline-20260507/signup-step-1-960x855-reference.png",
        "768": "visual-review/auth-signup-step1-all-baseline-20260507/signup-step-1-640x855-reference.png",
        "576": "visual-review/auth-signup-step1-all-baseline-20260507/signup-step-1-480x760-reference.png",
        "390": "visual-review/auth-signup-step1-all-baseline-20260507/signup-step-1-320x760-reference.png",
        "320": "visual-review/auth-signup-step1-all-baseline-20260507/signup-step-1-320x760-reference.png"
      },
      live: {
        "1200": "capture-auth-frame.html?page=signup-step-1.html&w=1280&h=855",
        "992": "capture-auth-frame.html?page=signup-step-1.html&w=960&h=855",
        "768": "capture-auth-frame.html?page=signup-step-1.html&w=640&h=855",
        "576": "capture-auth-frame.html?page=signup-step-1.html&w=480&h=760",
        "390": "capture-auth-frame.html?page=signup-step-1.html&w=320&h=760",
        "320": "capture-auth-frame.html?page=signup-step-1.html&w=320&h=760"
      },
      viewports: {
        "1200": { w: 1280, h: 855 },
        "992": { w: 960, h: 855 },
        "768": { w: 640, h: 855 },
        "576": { w: 480, h: 760 },
        "390": { w: 320, h: 760 },
        "320": { w: 320, h: 760 }
      },
      proof: "ready: 1200/992/768/576/390/320"
    },
    {
      key: "signup-step-2",
      label: "Sign in 2 STEP",
      page: "signup-step-2.html",
      status: "source ready",
      statusClass: "pill--pass",
      node: "local source-lineage",
      refs: {
        "1200": "visual-review/auth-signup-step2-final-pass-20260507/signup-step-2-1280x855-reference.png",
        "992": "visual-review/auth-signup-step2-final-pass-20260507/signup-step-2-960x855-reference.png",
        "768": "visual-review/auth-signup-step2-final-pass-20260507/signup-step-2-640x855-reference.png",
        "576": "visual-review/auth-signup-step2-final-pass-20260507/signup-step-2-480x760-reference.png",
        "390": "visual-review/auth-signup-step2-final-pass-20260507/signup-step-2-320x760-reference.png",
        "320": "visual-review/auth-signup-step2-final-pass-20260507/signup-step-2-320x760-reference.png"
      },
      live: {
        "1200": "capture-auth-frame.html?page=signup-step-2.html&w=1280&h=855",
        "992": "capture-auth-frame.html?page=signup-step-2.html&w=960&h=855",
        "768": "capture-auth-frame.html?page=signup-step-2.html&w=640&h=855",
        "576": "capture-auth-frame.html?page=signup-step-2.html&w=480&h=760",
        "390": "capture-auth-frame.html?page=signup-step-2.html&w=320&h=760",
        "320": "capture-auth-frame.html?page=signup-step-2.html&w=320&h=760"
      },
      viewports: {
        "1200": { w: 1280, h: 855 },
        "992": { w: 960, h: 855 },
        "768": { w: 640, h: 855 },
        "576": { w: 480, h: 760 },
        "390": { w: 320, h: 760 },
        "320": { w: 320, h: 760 }
      },
      proof: "ready: 1200/992/768/576/390/320"
    }
  ];

  const params = new URLSearchParams(window.location.search);
  let activeScreen = screens.find((screen) => screen.key === params.get("screen")) || screens[0];
  let activeBp = breakpoints.find((bp) => bp.key === params.get("bp")) || breakpoints[0];

  const screenTabs = document.querySelector("#screenTabs");
  const breakpointTabs = document.querySelector("#breakpointTabs");
  const screenMeta = document.querySelector("#screenMeta");
  const referenceStage = document.querySelector("#referenceStage");
  const liveStage = document.querySelector("#liveStage");
  const referenceLabel = document.querySelector("#referenceLabel");
  const liveLabel = document.querySelector("#liveLabel");
  const referenceStatus = document.querySelector("#referenceStatus");
  const liveStatus = document.querySelector("#liveStatus");

  function viewport(content) {
    return `<div class="viewport">${content}</div>`;
  }

  function getLiveSrc() {
    return activeScreen.live && activeScreen.live[activeBp.key]
      ? activeScreen.live[activeBp.key]
      : activeScreen.page;
  }

  function getViewport() {
    return activeScreen.viewports && activeScreen.viewports[activeBp.key]
      ? activeScreen.viewports[activeBp.key]
      : activeBp;
  }

  function emptyReference() {
    const isSourceReady = activeScreen.status === "source ready";
    const text = isSourceReady
      ? `Для ${activeBp.label} нет отдельного локального Figma reference. Доступный эталон: 1200+.`
      : `Для этого экрана нет настоящего full-screen Figma reference. Требуется node id + PNG/SVG export.`;
    return `
      <div class="empty">
        <b>Эталон недоступен</b>
        <div>${text}</div>
        <div class="commands">
          <div>Finder: <code>tools/find_auth_signup_source_truth.ps1</code></div>
          <div>Importer: <code>tools/import_auth_signup_source_truth.ps1</code></div>
        </div>
      </div>`;
  }

  function setScale() {
    const viewportSize = getViewport();
    document.documentElement.style.setProperty("--viewport-w", `${viewportSize.w}px`);
    document.documentElement.style.setProperty("--viewport-h", `${viewportSize.h}px`);
    requestAnimationFrame(() => {
      document.querySelectorAll(".stage").forEach((stage) => {
        const scale = Math.min((stage.clientWidth - 28) / viewportSize.w, (stage.clientHeight - 28) / viewportSize.h);
        stage.style.setProperty("--scale", Math.max(.18, scale).toFixed(4));
      });
    });
  }

  function renderTabs() {
    screenTabs.innerHTML = screens.map((screen) => `
      <button class="tab" type="button" data-screen="${screen.key}" aria-pressed="${screen.key === activeScreen.key}">${screen.label}</button>
    `).join("");
    breakpointTabs.innerHTML = breakpoints.map((bp) => `
      <button class="bp" type="button" data-bp="${bp.key}" aria-pressed="${bp.key === activeBp.key}">${bp.label}</button>
    `).join("");
    screenTabs.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        activeScreen = screens.find((screen) => screen.key === button.dataset.screen);
        updateUrl();
        render();
      });
    });
    breakpointTabs.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        activeBp = breakpoints.find((bp) => bp.key === button.dataset.bp);
        updateUrl();
        render();
      });
    });
  }

  function updateUrl() {
    const next = new URL(window.location.href);
    next.searchParams.set("screen", activeScreen.key);
    next.searchParams.set("bp", activeBp.key);
    history.replaceState(null, "", next);
  }

  function render() {
    renderTabs();
    const ref = activeScreen.refs[activeBp.key];
    const viewportSize = getViewport();
    screenMeta.innerHTML = `
      <span class="pill ${activeScreen.statusClass}">${activeScreen.status}</span>
      <span class="pill">node ${activeScreen.node}</span>
      <span class="pill">${viewportSize.w} x ${viewportSize.h}</span>
      <span class="pill">${activeScreen.proof}</span>
    `;
    referenceLabel.textContent = ref ? `${activeScreen.label} / ${activeBp.label}` : "No trusted reference for this state";
    liveLabel.textContent = `${getLiveSrc()} / ${activeBp.label}`;
    referenceStatus.className = `pill ${ref ? "pill--pass" : "pill--blocked"}`;
    referenceStatus.textContent = ref ? "reference" : "blocked";
    liveStatus.className = `pill ${activeScreen.statusClass}`;
    liveStatus.textContent = "live";
    referenceStage.innerHTML = ref ? viewport(`<img src="${ref}" alt="${activeScreen.label} reference">`) : emptyReference();
    liveStage.innerHTML = viewport(`<iframe src="${getLiveSrc()}" title="${activeScreen.label} live implementation"></iframe>`);
    setScale();
  }

  window.addEventListener("resize", setScale);
  render();
</script>
</body>
</html>
