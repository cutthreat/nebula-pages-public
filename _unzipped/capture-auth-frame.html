<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth capture frame</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #0f0f17;
    }

    iframe {
      display: block;
      width: var(--capture-width);
      height: var(--capture-height);
      border: 0;
      overflow: hidden;
      background: transparent;
      opacity: 0;
    }

    iframe.is-ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe id="capture" title="Auth capture target" scrolling="no"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const page = params.get("page") || "signup-step-1.html";
    const width = Math.max(1, Number(params.get("w")) || 320);
    const height = Math.max(1, Number(params.get("h")) || 760);
    document.documentElement.style.setProperty("--capture-width", `${width}px`);
    document.documentElement.style.setProperty("--capture-height", `${height}px`);
    const frame = document.getElementById("capture");
    frame.setAttribute("scrolling", "no");
    frame.addEventListener("load", async () => {
      try {
        const doc = frame.contentDocument;
        if (doc) {
          doc.documentElement.style.width = `${width}px`;
          doc.documentElement.style.height = `${height}px`;
          doc.documentElement.style.overflow = "hidden";
          if (doc.body) {
            doc.body.style.width = `${width}px`;
            doc.body.style.height = `${height}px`;
            doc.body.style.overflow = "hidden";
          }
        }
        if (doc && doc.fonts && doc.fonts.ready) {
          await doc.fonts.ready;
        }
        const images = Array.from(doc ? doc.images : []);
        await Promise.all(images.map((image) => {
          if (image.complete) return Promise.resolve();
          if (image.decode) return image.decode().catch(() => {});
          return new Promise((resolve) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", resolve, { once: true });
          });
        }));
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      } finally {
        frame.classList.add("is-ready");
      }
    });
    frame.src = page;
  </script>
</body>
</html>
