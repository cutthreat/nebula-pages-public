<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Home Frame Diagnostic</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .diag {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 8px 10px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            white-space: pre-wrap;
            font: 12px/1.4 monospace;
        }

        iframe {
            display: block;
            width: 320px;
            height: 2200px;
            border: 0;
            margin: 0 auto;
            background: #fff;
        }
    </style>
</head>
<body>
    <pre class="diag" id="diag">loading...</pre>
    <iframe id="homeFrame" src="home.html"></iframe>

    <script>
        const diag = document.getElementById("diag");
        const frame = document.getElementById("homeFrame");

        frame.addEventListener("load", () => {
            const doc = frame.contentDocument;
            const win = frame.contentWindow;
            const quote = doc.querySelector(".what-neuro-section__quote");
            const text = doc.querySelector(".what-neuro-section__quote-text");
            const hero = doc.querySelector(".hero-section__title");

            const fmt = (el, name) => {
                if (!el) return `${name}: none`;
                const rect = el.getBoundingClientRect();
                return `${name}: left=${Math.round(rect.left)} right=${Math.round(rect.right)} width=${Math.round(rect.width)}`;
            };

            diag.textContent =
`frame.innerWidth=${win.innerWidth}
frame.scrollWidth=${doc.documentElement.scrollWidth}
${fmt(hero, "hero")}
${fmt(quote, "quote")}
${fmt(text, "quoteText")}`;
        });
    </script>
</body>
</html>
