<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - Neuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth-login.css?v=20260404-auth-label-1" />
</head>
<body class="auth-login-page">
  <main class="login-stage" aria-label="Log in">
    <div class="login-frame">
      <div class="login-menu" aria-label="Top navigation">
        <button class="login-burger" type="button" tabindex="-1" aria-hidden="true"></button>
        <a class="login-brand" href="home.html" aria-label="Home">
          <img src="img/login-brand-figma.png" alt="NEURO" />
        </a>
        <div class="login-menu-right">
          <span class="login-lang">Eng ▾</span>
          <a class="login-signup" href="signup-step-1.html">Sign up →</a>
          <button class="login-toggle" type="button" tabindex="-1" aria-hidden="true">
            <img src="img/login-toggle-icon.svg" alt="" />
          </button>
        </div>
        <button class="login-mobile-toggle" type="button" tabindex="-1" aria-hidden="true">
          <img src="img/login-toggle-icon.svg" alt="" />
        </button>
      </div>

      <div class="login-hero" aria-hidden="true">
        <img src="img/login-left-figma.png" alt="" />
      </div>

      <section class="login-card-wrap" aria-label="Log in form">
        <div class="login-card">
          <form class="login-panel" action="home.html" method="get">
            <h1 class="login-title">Log In</h1>
            <p class="login-social-title">Log in with</p>

            <div class="login-social-row" aria-label="Social sign in">
              <button class="login-social" type="button" aria-label="Log in with Google">
                <img src="img/login-google-figma.png" alt="" />
              </button>
              <button class="login-social" type="button" aria-label="Log in with Facebook">
                <img src="img/login-facebook-figma.png" alt="" />
              </button>
            </div>

            <div class="login-divider" aria-hidden="true"></div>

            <div class="login-fields">
              <input class="login-field" type="email" placeholder="Your email" aria-label="Your email" />
              <input class="login-field" type="password" placeholder="Your password" aria-label="Your password" />
              <a class="login-forgot" href="auth-forgot-new.html">Forgot password?</a>
              <button class="login-submit" type="submit">Log in</button>
              <p class="login-legal">
                By logging in, you agree to our <a href="terms-conditions-new.html">Terms of service</a><br />
                and <a href="privacy-policy-new.html">Privacy Policy</a>
              </p>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

<script>
window.addEventListener('load', () => {
  const el = document.querySelector('.login-mobile-toggle');
  const menu = document.querySelector('.login-menu-right');
  const info = {
    innerWidth: window.innerWidth,
    scrollWidth: document.documentElement.scrollWidth,
    bodyScrollWidth: document.body.scrollWidth,
    toggle: el ? {x: Math.round(el.getBoundingClientRect().x), y: Math.round(el.getBoundingClientRect().y), w: Math.round(el.getBoundingClientRect().width), h: Math.round(el.getBoundingClientRect().height)} : null,
    menu: menu ? {x: Math.round(menu.getBoundingClientRect().x), y: Math.round(menu.getBoundingClientRect().y), w: Math.round(menu.getBoundingClientRect().width), h: Math.round(menu.getBoundingClientRect().height)} : null
  };
  const pre = document.createElement('pre');
  pre.id = 'dbg';
  pre.style.position = 'fixed';
  pre.style.left = '0';
  pre.style.top = '0';
  pre.style.zIndex = '999999';
  pre.style.margin = '0';
  pre.style.padding = '6px';
  pre.style.background = 'rgba(0,0,0,.85)';
  pre.style.color = '#0f0';
  pre.style.fontSize = '10px';
  pre.textContent = JSON.stringify(info, null, 2);
  document.body.appendChild(pre);
});
</script>

</body>
</html>
