<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Top up to continue — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/top-up-to-continue.css" />
</head>
<body>
  <button class="sr-only" type="button" data-continuation-anchor>Paused consultation funding status</button>
  <main class="continuation-topup"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="continuation_topup_required"
        data-static-projection="true"
        data-commercial-copy="fixture-only"
        data-deadline-copy="fixture-only"
        data-session-id="fixture-session"
        data-session-version="fixture-v1"
        data-catalog-version="fixture-catalog-v1"
        data-selected-package-id="fixture-350"
        data-nebula-continuation-topup>
    <section class="continuation-topup__frame"
             data-node-id="1405:42214"
             data-node-id-992="1405:42263"
             data-node-id-768="1405:42312"
             data-node-id-576="1405:42361"
             data-node-id-320="1405:42410">
      <article class="continuation-topup__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="continuation-topup-title"
               aria-describedby="continuation-topup-status">
        <div class="continuation-topup__toolbar">
          <button class="continuation-topup__close" type="button" aria-label="Close top up selection" data-continuation-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/top-up-to-continue/close.svg" alt="" />
          </button>
        </div>

        <div class="continuation-topup__body">
          <div class="continuation-topup__head">
            <div class="continuation-topup__intro">
              <h1 id="continuation-topup-title" tabindex="-1">Refill credits to continue chat</h1>
              <div class="continuation-topup__status" id="continuation-topup-status">
                <span class="continuation-topup__time">
                  <img src="yii2/modules/nebulaAccount/resources/images/top-up-to-continue/time.svg" alt="" />
                  <strong>00:10</strong>
                </span>
                <p><b>Margo Lover</b> will wait for you!</p>
              </div>
            </div>

            <div class="continuation-topup__packages" role="radiogroup" aria-label="Credit package fixture">
              <div class="continuation-topup__best-wrap">
                <span class="continuation-topup__best-label">BEST VALUE</span>
                <button class="continuation-topup__package" type="button" role="radio" aria-checked="false" tabindex="-1"
                        data-package-id="fixture-1800" data-package-version="fixture-v1">
                  <span class="continuation-topup__package-copy">
                    <strong>1800 credits</strong>
                    <small>+600 extra credits</small>
                  </span>
                  <b>$ 99.99</b>
                </button>
              </div>
              <button class="continuation-topup__package is-selected" type="button" role="radio" aria-checked="true" tabindex="0"
                      data-package-id="fixture-350" data-package-version="fixture-v1">
                <span class="continuation-topup__package-copy">
                  <strong>350 credits</strong>
                  <small>+50 extra credits</small>
                </span>
                <b>$ 24.99</b>
              </button>
              <button class="continuation-topup__package" type="button" role="radio" aria-checked="false" tabindex="-1"
                      data-package-id="fixture-120" data-package-version="fixture-v1">
                <span class="continuation-topup__package-copy"><strong>120 credits</strong></span>
                <b>$ 9.99</b>
              </button>
            </div>
          </div>

          <button class="continuation-topup__pay" type="button" data-continuation-action="checkout">
            <span>Pay and continue</span>
          </button>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-continuation-live>The displayed deadline and packages are static C76 fixtures only.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/top-up-to-continue.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
