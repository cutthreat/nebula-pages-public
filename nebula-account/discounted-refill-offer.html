<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discounted refill offer — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/discounted-refill-offer.css" />
</head>
<body>
  <button class="sr-only" type="button" data-discount-offer-anchor>Discounted refill offer status</button>
  <main class="discount-offer"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="discounted_refill_offer"
        data-static-projection="true"
        data-pricing-copy="fixture-only"
        data-offer-id="fixture-discount-offer"
        data-offer-version="fixture-v1"
        data-catalog-version="fixture-catalog-v1"
        data-expert-id="fixture-expert"
        data-reading-intent-id="fixture-reading"
        data-nebula-discount-offer>
    <section class="discount-offer__frame"
             data-node-id="1383:32776"
             data-node-id-992="1407:30040"
             data-node-id-768="1407:30076"
             data-node-id-576="1407:30112"
             data-node-id-320="1407:30148">
      <article class="discount-offer__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="discount-offer-title"
               aria-describedby="discount-offer-subtitle">
        <div class="discount-offer__toolbar">
          <button class="discount-offer__close" type="button" aria-label="Close discounted refill offer" data-discount-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/discounted-refill-offer/close.svg" alt="" />
          </button>
        </div>

        <div class="discount-offer__body">
          <div class="discount-offer__head">
            <header class="discount-offer__heading">
              <h1 id="discount-offer-title" tabindex="-1">Refill credits for the reading</h1>
              <p id="discount-offer-subtitle">Refill and continue to get insight with Margo Lover</p>
            </header>

            <div class="discount-offer__summary" aria-label="Static discounted refill offer fixture">
              <div class="discount-offer__card">
                <span class="discount-offer__details">
                  <strong>160 credits</strong>
                  <small><img src="yii2/modules/nebulaAccount/resources/images/discounted-refill-offer/welcome-star.svg" alt="" />WELCOME PACK</small>
                </span>
                <span class="discount-offer__prices"><s>$ 19.99</s><b>$ 2.99</b></span>
              </div>
              <span class="discount-offer__badge">-85% DISCOUNT</span>
            </div>
          </div>

          <button class="discount-offer__continue" type="button" data-discount-action="continue">Continue</button>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-discount-live>The displayed discount and prices are static C76 fixtures only.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/discounted-refill-offer.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
