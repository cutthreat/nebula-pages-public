<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>System messages — Neuro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/profile.css">
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/notifications.css">
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/system-messages.css">
</head>
<body class="nb-account-body">
  <main class="nb-account-page nb-notifications-page nb-messages-page" data-nebula-system-messages data-static-projection="true" data-balance-fixture="responsive-c76-sample">
    <header class="nb-topbar">
      <a class="nb-logo" href="profile.html" aria-label="Neuro profile"><img src="yii2/modules/nebulaAccount/resources/images/chatroom/neuro-logo.webp" alt="Neuro"></a>
      <div class="nb-topbar__right">
        <nav class="nb-topnav" aria-label="Primary navigation"><span>Psychic</span><span>Favorite</span><a href="chatroom.html">Chatroom</a><a href="horoscope.html">Horoscope</a></nav>
        <div class="nb-account-summary" aria-label="Account summary"><div class="nb-credit-pill" aria-label="Credits balance 120"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-03.svg" alt=""><span>120</span></div><div class="nb-menu-pill" aria-label="Account menu"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-08.svg" alt=""><span class="nb-notifications-vi"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-13.svg" alt=""><b>VI</b></span></div></div>
      </div>
    </header>
    <div class="nb-account-layout nb-notifications-layout">
      <aside class="nb-account-sidebar nb-notifications-sidebar" aria-label="Account navigation">
        <div class="nb-sidebar-profile"><div class="nb-sidebar-photo"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-raw-03.jpeg" alt="Victoriya"></div><strong>Victoriya</strong></div>
        <nav class="nb-sidebar-nav"><a href="profile.html"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-01.svg" alt="">Profile</a><span><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-06.svg" alt="">Psychics</span><a href="chatroom.html"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-07.svg" alt="">Chatroom <b>3</b></a><span><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-09.svg" alt="">Favorite</span><a href="horoscope.html"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-04.svg" alt="">Horoscope</a><a class="is-current" href="settings.html"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-11.svg" alt="">Setting</a></nav>
        <div class="nb-sidebar-balance"><strong>Balance: <span class="system-balance-1200">0 credits</span><span class="system-balance-compact">120 credits</span></strong><div class="nb-refill-visual"><img src="yii2/modules/nebulaAccount/resources/images/account-shell/settings-vector-03.svg" alt="">Refill credits</div></div>
      </aside>
      <section class="nb-messages-content" aria-labelledby="system-messages-title">
        <a class="nb-messages-back" href="notifications.html" aria-label="Back to notifications"><img src="yii2/modules/nebulaAccount/resources/images/system-messages/back.svg" alt=""></a>
        <section class="nb-messages-intro"><h1 id="system-messages-title">System messages</h1><p>Notifications about important account updates and activity</p></section>
        <section class="nb-messages-card nb-messages-card--allow" aria-label="Allow system notifications: on"><span>Allow system notifications</span><img src="yii2/modules/nebulaAccount/resources/images/system-messages/on.svg" alt=""></section>
        <div class="nb-messages-rule" aria-hidden="true"></div>
        <section class="nb-messages-channel"><h2>Choose where you get notified</h2><div class="nb-messages-card nb-messages-card--channels" aria-label="Static notification channels"><div aria-label="Email: off"><span>Email</span><img src="yii2/modules/nebulaAccount/resources/images/system-messages/off.svg" alt=""></div><div aria-label="SMS: off"><span>SMS</span><img src="yii2/modules/nebulaAccount/resources/images/system-messages/off.svg" alt=""></div></div></section>
      </section>
    </div>
  </main>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
