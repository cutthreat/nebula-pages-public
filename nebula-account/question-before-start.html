<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Question before chat — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/question-before-start.css" />
</head>
<body>
  <main class="question-before-start" data-route-owner="/nebula-account/chatroom" data-c76-state="question_before_start" data-nebula-question-before-start>
    <section class="question-before-start__frame" data-node-id="1396:32772" data-node-id-992="1405:39764" data-node-id-768="1405:39800" data-node-id-576="1405:39836" data-node-id-320="1405:39872">
      <article class="question-before-start__modal" role="dialog" aria-modal="true" aria-labelledby="question-before-start-title" aria-describedby="question-before-start-description">
        <button class="question-before-start__close" type="button" aria-label="Close" data-question-action="close">
          <img src="yii2/modules/nebulaAccount/resources/images/question-before-start/close.svg" alt="" />
        </button>

        <header class="question-before-start__intro">
          <h1 id="question-before-start-title">Send a question</h1>
          <p id="question-before-start-description">Give Margo Lover enough context before the consultation begins</p>
        </header>

        <div class="question-before-start__fields">
          <label class="sr-only" for="question-subject">Subject of the request</label>
          <input id="question-subject" type="text" placeholder="Subject of the request" autocomplete="off" data-question-subject />
          <label class="sr-only" for="question-dob">Date of birth (DD.MM.YYYY)</label>
          <input id="question-dob" type="text" inputmode="numeric" placeholder="Date of birth: 01.01.1990" autocomplete="bday" data-question-dob />
          <label class="sr-only" for="question-details">Detailed question</label>
          <textarea id="question-details" placeholder="Ask and describe in detail the topic that interests you." data-question-details></textarea>
        </div>

        <button class="question-before-start__attachment" type="button" data-question-action="attachment-intent">
          <img src="yii2/modules/nebulaAccount/resources/images/question-before-start/attachment.svg" alt="" />
          <span>Attach a file if required</span>
        </button>

        <div class="question-before-start__submit-group">
          <button class="question-before-start__submit" type="button" data-question-action="submit-intent">
            <span>Start chat</span>
            <img src="yii2/modules/nebulaAccount/resources/images/question-before-start/chat-white.svg" alt="" />
          </button>
          <p>Chat for <strong>45 credits/min</strong></p>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-question-live></p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/question-before-start.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
