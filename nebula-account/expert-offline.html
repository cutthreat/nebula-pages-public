<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>
Expert offline</title>
<link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/expert-offline.css">
</head>
<body>
<main class="offline" data-static-projection="true" data-c76-state="expert_offline">
<article class="offline__modal" role="dialog" aria-modal="true" aria-labelledby="offline-title">
<button class="offline__close" type="button" aria-label="Close"><img src="yii2/modules/nebulaAccount/resources/images/fast-batch-02/offline-close.svg" alt=""></button>
<div class="offline__content">
<h1 id="offline-title">
Margo’s lover is currently offline</h1>
<p>
An expert matches your search but is currently offline. You can receive a notification or select an available expert</p>
<div class="offline__actions">
<button type="button" data-action="select">
Select another expert</button>
<button type="button" data-action="notify">
Notify me</button>
</div>
<button class="offline__link" type="button" data-action="question">
Send a question in advance</button>
</div>
</article>
</main>
<script src="yii2/modules/nebulaAccount/resources/js/expert-offline.js">
</script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
