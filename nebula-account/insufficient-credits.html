<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insufficient credits — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/insufficient-credits.css" />
</head>
<body>
  <button class="sr-only" type="button" data-balance-pause-anchor>Balance pause status</button>
  <main class="insufficient-credits"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="insufficient_credits_autorefill_offer"
        data-static-projection="true"
        data-commercial-copy="fixture-only"
        data-session-id="fixture-balance-pause-session"
        data-session-version="fixture-v1"
        data-nebula-insufficient-credits>
    <section class="insufficient-credits__frame"
             data-node-id="1380:30297"
             data-node-id-992="1405:42098"
             data-node-id-768="1405:42127"
             data-node-id-576="1405:42156"
             data-node-id-320="1405:42185">
      <article class="insufficient-credits__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="insufficient-credits-title"
               aria-describedby="insufficient-credits-status insufficient-credits-offer">
        <div class="insufficient-credits__toolbar">
          <button class="insufficient-credits__close" type="button" aria-label="Close insufficient credits offer" data-balance-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/insufficient-credits/close.svg" alt="" />
          </button>
        </div>

        <div class="insufficient-credits__body">
          <div class="insufficient-credits__offer">
            <header class="insufficient-credits__heading">
              <p id="insufficient-credits-status">Not enough credits to continue</p>
              <h1 id="insufficient-credits-title" tabindex="-1">Experience seamless conversations</h1>
            </header>

            <div class="insufficient-credits__visual">
              <img src="yii2/modules/nebulaAccount/resources/images/insufficient-credits/auto-refill.png" alt="" />
              <p id="insufficient-credits-offer">Activate auto refill for effortless balance replenishment for 120 credits ($9.99)</p>
            </div>
          </div>

          <div class="insufficient-credits__actions">
            <button class="insufficient-credits__activate" type="button" data-balance-action="activate">Activate</button>
            <button class="insufficient-credits__skip" type="button" data-balance-action="standard-topup">Skip, I am okey with standard payment process</button>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-balance-live>The displayed auto refill economics are a static C76 fixture only.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/insufficient-credits.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
