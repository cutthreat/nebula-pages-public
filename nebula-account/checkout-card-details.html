<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout card details — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/checkout-card-details.css" />
</head>
<body>
  <button class="sr-only" type="button" data-card-details-anchor>Upstream checkout state</button>
  <main class="card-details"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="checkout_card_details"
        data-static-projection="true"
        data-order-copy="fixture-only"
        data-checkout-id="fixture-checkout"
        data-checkout-version="fixture-checkout-v1"
        data-package-id="fixture-package"
        data-package-version="fixture-package-v1"
        data-selected-method-id="fixture-saved-card"
        data-selected-method-version="fixture-saved-card-v1"
        data-method-idempotency-key="fixture-method-selection"
        data-chooser-idempotency-key="fixture-saved-method-chooser"
        data-secure-form-idempotency-key="fixture-secure-form"
        data-submit-idempotency-key="fixture-checkout-submit"
        data-nebula-card-details>
    <section class="card-details__frame"
             data-node-id="1488:44468"
             data-node-id-992="1488:44549"
             data-node-id-768="1488:44630"
             data-node-id-576="1488:44711"
             data-node-id-320="1488:44792">
      <article class="card-details__modal" role="dialog" aria-modal="true" aria-labelledby="card-details-title">
        <div class="card-details__toolbar">
          <button class="card-details__close" type="button" aria-label="Close card details" data-card-details-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-07.svg" alt="" />
          </button>
        </div>

        <div class="card-details__body">
          <div class="card-details__head">
            <section class="card-details__order" aria-label="Order fixture details">
              <h1 id="card-details-title" tabindex="-1">Order details:</h1>
              <img class="card-details__divider" src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-03.svg" alt="" />
              <div class="card-details__line card-details__package">
                <span><strong>Package</strong><small>Includes: 350 credits</small></span><b>$24.99</b>
              </div>
              <img class="card-details__divider" src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-03.svg" alt="" />
              <div class="card-details__line"><strong>Total:</strong><b>$24.99</b></div>
              <img class="card-details__divider" src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-03.svg" alt="" />
            </section>

            <section class="card-details__payment" aria-labelledby="card-details-payment-title">
              <h2 id="card-details-payment-title">Choose payment method</h2>
              <div class="card-details__methods" role="radiogroup" aria-labelledby="card-details-payment-title">
                <div class="card-details__providers">
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-method-id="fixture-paypal" data-method-version="fixture-paypal-v1" data-method-type="paypal" aria-label="PayPal">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-08.svg" alt="PayPal" />
                  </button>
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-method-id="fixture-apple-pay" data-method-version="fixture-apple-v1" data-method-type="apple_pay" aria-label="Apple Pay">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-11.svg" alt="Apple Pay" />
                  </button>
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-method-id="fixture-credit-card" data-method-version="fixture-credit-card-v1" data-method-type="credit_card" aria-label="Credit Card">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-14.svg" alt="" /><span>Credit Card</span>
                  </button>
                </div>
                <div class="card-details__saved-row">
                  <button class="card-details__saved" type="button" role="radio" aria-checked="true" tabindex="0" data-method-id="fixture-saved-card" data-method-version="fixture-saved-card-v1" data-method-type="saved_card" aria-label="Saved Mastercard 5457 08XX XXXX 1075">
                    <span><img class="card-details__selected" src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-09.svg" alt="" /><img class="card-details__mastercard" src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-05.svg" alt="Mastercard" /></span>
                    <b>5457 08XX XXXX 1075</b>
                  </button>
                  <button class="card-details__saved-chooser" type="button" aria-label="Choose another saved payment method" data-card-details-action="saved-chooser">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-04.svg" alt="" />
                  </button>
                </div>
              </div>

              <div class="card-details__fields" aria-label="Secure payment fields are provider-hosted and unavailable in this fixture">
                <div class="card-details__field-row">
                  <div class="card-details__field-group"><span>Validity period</span><button type="button" data-card-details-action="secure-form" data-secure-field-slot="expiry">MM/YY</button></div>
                  <div class="card-details__field-group"><span>CVV/CVC</span><button type="button" data-card-details-action="secure-form" data-secure-field-slot="security-code"><i>CVV</i><em aria-hidden="true">!</em></button></div>
                </div>
                <div class="card-details__field-group"><span>Name on the card</span><button type="button" data-card-details-action="secure-form" data-secure-field-slot="cardholder-name">FULL NAME AS ON THE CARD</button></div>
              </div>
            </section>
          </div>

          <button class="card-details__buy" type="button" data-card-details-action="submit">Buy</button>

          <div class="card-details__security" aria-label="Guaranteed security payments, source fixture">
            <img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-12.svg" alt="" /><span>Guaranteed security payments</span>
          </div>

          <div class="card-details__networks" aria-label="Supported payment networks, source fixture">
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-05.svg" alt="Mastercard" /></span>
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-06.svg" alt="Visa" /></span>
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-02.svg" alt="American Express" /></span>
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-card-details/asset-10.svg" alt="Discover" /></span>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-card-details-live>All order, card and security values are static C76 fixtures; secure form and checkout remain host-owned.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/checkout-card-details.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
