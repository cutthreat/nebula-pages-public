<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reconnect grace — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/reconnect-grace.css" />
</head>
<body>
  <button class="sr-only" type="button" data-reconnect-fixture-anchor>Consultation status anchor</button>
  <main class="reconnect-grace"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="reconnect_grace"
        data-static-projection="true"
        data-nebula-reconnect-grace>
    <section class="reconnect-grace__frame"
             data-node-id="1405:41514"
             data-node-id-992="1405:41563"
             data-node-id-768="1405:41612"
             data-node-id-576="1405:41661"
             data-node-id-320="1405:41711">
      <article class="reconnect-grace__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="reconnect-grace-title"
               aria-describedby="reconnect-grace-description">
        <div class="reconnect-grace__toolbar">
          <button class="reconnect-grace__close"
                  type="button"
                  aria-label="Dismiss reconnect status"
                  data-reconnect-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/reconnect-grace/vector-02.svg" alt="" />
          </button>
        </div>

        <div class="reconnect-grace__body">
          <header class="reconnect-grace__intro">
            <h1 id="reconnect-grace-title" tabindex="-1">Contact with the expert has been lost</h1>
            <p id="reconnect-grace-description"><span data-reconnect-expert-name>Margo Lover</span> is reconnecting. The charge is suspended while the expert is offline.</p>
          </header>

          <div class="reconnect-grace__flow">
            <div class="reconnect-grace__status">
              <div class="reconnect-grace__profile">
                <div class="reconnect-grace__avatar">
                  <picture>
                    <source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/reconnect-grace/raw-02.png" />
                    <img src="yii2/modules/nebulaAccount/resources/images/reconnect-grace/raw-01.png" alt="Margo Lover" data-reconnect-expert-avatar />
                  </picture>
                  <span class="reconnect-grace__warning" aria-hidden="true">!</span>
                </div>
                <strong data-reconnect-expert-name>Margo Lover</strong>
              </div>
              <div class="reconnect-grace__progress" role="img" aria-label="Reconnect progress is controlled by the server"><span></span></div>
            </div>

            <div class="reconnect-grace__actions">
              <button class="reconnect-grace__wait" type="button" data-reconnect-action="wait">
                <span>Wait for <span data-reconnect-expert-name>Margo Lover</span></span>
              </button>
              <button class="reconnect-grace__support" type="button" data-reconnect-action="support">Contact support</button>
            </div>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-reconnect-live>Reconnect grace fixture.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/reconnect-grace.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
