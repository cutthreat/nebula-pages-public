<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>What do you want clarity on?</title>
    <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/question-topics.css">
</head>
<body>
<main class="topic-picker" data-static-projection="true" data-live-mount="0" data-route-intent="unbound" data-backend-capability="unbound" data-c76-state="question-topic-picker">
    <section class="topic-picker__panel" aria-labelledby="topic-picker-title">
        <header class="topic-picker__header">
            <h1 id="topic-picker-title">What do you want clarity on?</h1>
            <p>Please select topics that interest you so that we can more accurately select psychics</p>
        </header>
        <div class="topic-picker__options" aria-label="Topics">
            <button class="topic-picker__option is-selected" type="button" data-topic="love" aria-pressed="true">
                <span><strong>Love situation</strong><small>Relationships, breakups, compatibility</small></span>
                <img src="yii2/modules/nebulaAccount/resources/images/fast-batch-04/g02-selected.svg" alt="">
            </button>
            <button class="topic-picker__option" type="button" data-topic="career" aria-pressed="false">
                <span><strong>Career</strong><small>Work, money, next step, choosing a path</small></span>
                <img src="yii2/modules/nebulaAccount/resources/images/fast-batch-04/g02-unselected.svg" alt="">
            </button>
            <button class="topic-picker__option" type="button" data-topic="personal-wealth" aria-pressed="false">
                <span><strong>Personal wealth</strong><small>Energy, health, purpose, confidence</small></span>
                <img src="yii2/modules/nebulaAccount/resources/images/fast-batch-04/g02-unselected.svg" alt="">
            </button>
        </div>
        <button class="topic-picker__next" type="button" data-topic-action="next">
            <span>Next step</span>
        </button>
    </section>
</main>
<script src="yii2/modules/nebulaAccount/resources/js/question-topics.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
