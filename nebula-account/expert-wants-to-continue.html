<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expert wants to continue — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/expert-wants-to-continue.css" />
</head>
<body>
  <button class="sr-only" type="button" data-offer-anchor>Follow-up offer status</button>
  <main class="followup-offer"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="expert_followup_offer_pending"
        data-static-projection="true"
        data-visible-copy="fixture-only"
        data-offer-id="fixture-followup-offer"
        data-offer-version="fixture-v1"
        data-expert-id="fixture-margo-lover"
        data-nebula-followup-offer>
    <section class="followup-offer__frame"
             data-node-id="1492:51073"
             data-node-id-992="1497:46460"
             data-node-id-768="1497:46564"
             data-node-id-576="1497:46668"
             data-node-id-320="1497:46772">
      <article class="followup-offer__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="followup-offer-title"
               aria-describedby="followup-offer-subtitle followup-offer-deadline">
        <div class="followup-offer__toolbar">
          <button class="followup-offer__close" type="button" aria-label="Close follow-up offer" data-offer-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/expert-wants-to-continue/close.svg" alt="" />
          </button>
        </div>

        <div class="followup-offer__body">
          <div class="followup-offer__head">
            <div class="followup-offer__heading">
              <h1 id="followup-offer-title" tabindex="-1">Get new insight from you<br class="followup-offer__desktop-break" /> previous chat</h1>
              <p id="followup-offer-subtitle">Margo Lover is already waiting for you!</p>
            </div>

            <div class="followup-offer__card-wrap">
              <div class="followup-offer__card" aria-label="Follow-up message from Margo Lover">
                <span class="followup-offer__avatar">
                  <img src="yii2/modules/nebulaAccount/resources/images/expert-wants-to-continue/avatar.png" alt="" />
                  <img class="followup-offer__presence" src="yii2/modules/nebulaAccount/resources/images/expert-wants-to-continue/busy.svg" alt="" />
                </span>
                <span class="followup-offer__message">
                  <strong>Margo Lover</strong>
                  <span>you there?</span>
                </span>
                <time>8:41 PM</time>
              </div>
            </div>

            <div class="followup-offer__deadline" id="followup-offer-deadline">
              <p>Margo Lover is waiting for you.</p>
              <p>Connect within <strong>00:55</strong> to continue your chat.</p>
            </div>
          </div>

          <button class="followup-offer__start" type="button" data-offer-action="accept">
            <span>Start chat</span>
          </button>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-offer-live>The expert, message, presence, time and countdown are static C76 fixtures only.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/expert-wants-to-continue.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
