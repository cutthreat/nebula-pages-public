<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>
End or stay in chat</title>
<link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/end-or-stay.css">
</head>
<body>
<main class="endstay" data-static-projection="true" data-c76-state="end_or_stay_confirmation">
<article class="endstay__modal" role="dialog" aria-modal="true" aria-labelledby="endstay-title">
<button class="endstay__close" type="button" aria-label="Close"><img src="yii2/modules/nebulaAccount/resources/images/fast-batch-02/endstay-close.svg" alt=""></button>
<div class="endstay__content">
<div class="endstay__mark"><img src="yii2/modules/nebulaAccount/resources/images/fast-batch-02/endstay-ring-a.svg" alt=""><img src="yii2/modules/nebulaAccount/resources/images/fast-batch-02/endstay-ring-b.svg" alt=""><b>?</b></div>
<h1 id="endstay-title">
Are you sure you want to end the chat?</h1>
<p>
Please note: once ended, the psychic won’t be able to give you an answer.</p>
<div class="endstay__actions">
<button type="button" data-action="end">
End chat</button>
<button type="button" data-action="stay">
Stay in chat</button>
</div>
</div>
</article>
</main>
<script src="yii2/modules/nebulaAccount/resources/js/end-or-stay.js">
</script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
