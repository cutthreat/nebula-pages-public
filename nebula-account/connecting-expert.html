<body>
  <button class="sr-only" type="button" data-connecting-fixture-anchor>Consultation status anchor</button>
  <main class="connecting-expert" data-route-owner="/nebula-account/chatroom" data-c76-state="consultation_connecting" data-static-projection="true" data-nebula-connecting-expert>
    <section class="connecting-expert__frame" data-node-id="1397:35852" data-node-id-992="1405:41284" data-node-id-768="1405:41334" data-node-id-576="1405:41384" data-node-id-320="1405:41435">
      <article class="connecting-expert__modal" role="dialog" aria-modal="true" aria-busy="true" aria-labelledby="connecting-expert-title">
        <div class="connecting-expert__toolbar"><button class="connecting-expert__close" type="button" aria-label="Dismiss connecting status" data-connecting-action="dismiss"><picture><source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/connecting-expert/close-mobile.svg" /><img src="yii2/modules/nebulaAccount/resources/images/connecting-expert/close-desktop.svg" alt="" /></picture></button></div>
        <div class="connecting-expert__body">
          <h1 id="connecting-expert-title" tabindex="-1">Connecting you to Margo Lover so you can get the answer to your question</h1>
          <div class="connecting-expert__status">
            <div class="connecting-expert__profile">
              <div class="connecting-expert__avatar"><picture><source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/connecting-expert/portrait-mobile.png" /><img src="yii2/modules/nebulaAccount/resources/images/connecting-expert/portrait-desktop.png" alt="Margo Lover" /></picture></div>
              <strong>Margo Lover</strong>
            </div>
            <div class="connecting-expert__progress" role="progressbar" aria-label="Connection pending" aria-valuetext="Waiting for server status"><span></span></div>
          </div>
          <div class="connecting-expert__facts" aria-label="Connection information">
            <p><picture><source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/connecting-expert/coin-mobile.svg" /><img src="yii2/modules/nebulaAccount/resources/images/connecting-expert/coin-desktop.svg" alt="" /></picture><span>You will not be charged during this step</span></p>
            <p><picture><source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/connecting-expert/time-mobile.svg" /><img src="yii2/modules/nebulaAccount/resources/images/connecting-expert/time-desktop.svg" alt="" /></picture><span>Connection to the psychic takes 15-20 sec</span></p>
            <p><picture><source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/connecting-expert/dialog-mobile.svg" /><img src="yii2/modules/nebulaAccount/resources/images/connecting-expert/dialog-desktop.svg" alt="" /></picture><span>Once connected, you can discuss any topic</span></p>
            <p><picture><source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/connecting-expert/star-mobile.svg" /><img src="yii2/modules/nebulaAccount/resources/images/connecting-expert/star-desktop.svg" alt="" /></picture><span>The psychic is focused on you. Enjoy!</span></p>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-connecting-live>Connecting status fixture.</p>
  </main>
