<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your astrological details</title>
    <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/astrological-details.css">
</head>
<body>
<main class="astrological-details" data-static-projection="true" data-live-mount="0" data-route-intent="unbound" data-backend-capability="unbound" data-c76-state="astrological_details_fixture">
    <span data-origin-trigger tabindex="-1"></span>
    <section class="astrological-details__panel" role="dialog" aria-modal="true" aria-labelledby="astrological-details-title">
        <header class="astrological-details__bar">
            <button class="astrological-details__back" type="button" data-action="back">
                <img src="yii2/modules/nebulaAccount/resources/images/fast-batch-04/g03-back.svg" alt="">
                <span>Go back</span>
            </button>
            <button class="astrological-details__close" type="button" aria-label="Close" data-action="dismiss">
                <img src="yii2/modules/nebulaAccount/resources/images/fast-batch-04/g03-close.svg" alt="">
            </button>
        </header>
        <div class="astrological-details__content">
            <header>
                <h1 id="astrological-details-title">Your astrological details</h1>
                <p>Please fill in the information so that we can more accurately select psychics</p>
            </header>
            <div class="astrological-details__fields" aria-label="Static astrological details">
                <p>Date of birth: 1992-05-07</p>
                <p>Place of birth: Minsk, City of Minsk Region, Belarus</p>
                <p>Time of birth: 00:10:00</p>
            </div>
            <button class="astrological-details__continue" type="button" data-action="continue">
                <span>Continue</span>
            </button>
        </div>
    </section>
</main>
<script src="yii2/modules/nebulaAccount/resources/js/astrological-details.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
