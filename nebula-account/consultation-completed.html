<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultation completed — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/consultation-completed.css" />
</head>
<body>
  <button class="sr-only" type="button" data-completed-fixture-anchor>Chat composer anchor</button>
  <main class="consultation-completed"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="consultation_completed"
        data-static-projection="true"
        data-nebula-consultation-completed>
    <section class="consultation-completed__frame"
             data-node-id="1395:31989"
             data-node-id-992="1407:30396"
             data-node-id-768="1407:30434"
             data-node-id-576="1407:30472"
             data-node-id-320="1407:30510">
      <article class="consultation-completed__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="consultation-completed-title">
        <div class="consultation-completed__toolbar">
          <button class="consultation-completed__close" type="button" aria-label="Close completed consultation" data-completed-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/close.svg" alt="" />
          </button>
        </div>

        <div class="consultation-completed__body">
          <h1 id="consultation-completed-title" tabindex="-1">The consultation is complete!</h1>
          <div class="consultation-completed__flow">
            <div class="consultation-completed__rating">
              <div class="consultation-completed__prompt">
                <picture>
                  <source media="(max-width:320px)" srcset="yii2/modules/nebulaAccount/resources/images/consultation-completed/avatar-compact.png" />
                  <img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/avatar-1200.png" alt="Margo Lover" data-completed-expert-avatar />
                </picture>
                <p>Rate <span data-completed-expert-name>Margo Lover</span>’s consultation</p>
              </div>
              <div class="consultation-completed__stars"
                   role="radiogroup"
                   aria-label="Rate Margo Lover’s consultation"
                   data-filled-star="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-filled.svg"
                   data-outline-star="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-outline.svg"
                   data-completed-rating>
                <button type="button" role="radio" aria-label="1 out of 5" aria-checked="false" tabindex="-1" data-rating="1"><img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-filled.svg" alt="" /></button>
                <button type="button" role="radio" aria-label="2 out of 5" aria-checked="false" tabindex="-1" data-rating="2"><img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-filled.svg" alt="" /></button>
                <button type="button" role="radio" aria-label="3 out of 5" aria-checked="true" tabindex="0" data-rating="3"><img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-filled.svg" alt="" /></button>
                <button type="button" role="radio" aria-label="4 out of 5" aria-checked="false" tabindex="-1" data-rating="4"><img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-outline.svg" alt="" /></button>
                <button type="button" role="radio" aria-label="5 out of 5" aria-checked="false" tabindex="-1" data-rating="5"><img src="yii2/modules/nebulaAccount/resources/images/consultation-completed/star-outline.svg" alt="" /></button>
              </div>
            </div>

            <div class="consultation-completed__actions">
              <div class="consultation-completed__primary-actions">
                <button class="consultation-completed__ask" type="button" data-completed-action="ask-next">Ask next question</button>
                <button class="consultation-completed__review" type="button" data-completed-action="write-review">Write a review</button>
              </div>
              <button class="consultation-completed__return" type="button" data-completed-action="return">Return to chat</button>
            </div>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-completed-live>Completed consultation fixture with a local three-star draft.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/consultation-completed.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
