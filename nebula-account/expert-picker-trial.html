<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trial expert picker — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/expert-picker-trial.css" />
</head>
<body>
  <main class="expert-picker-trial" data-route-owner="/nebula-account/chatroom" data-c76-state="expert_picker_trial" data-static-projection="true" data-nebula-expert-picker-trial>
    <section class="expert-picker-trial__frame" data-node-id="1407:31014" data-node-id-992="1407:31109" data-node-id-768="1407:31204" data-node-id-576="1407:31299" data-node-id-320="1407:31394">
      <article class="expert-picker-trial__modal" role="dialog" aria-modal="true" aria-labelledby="expert-picker-trial-title" aria-describedby="expert-picker-trial-description">
        <button class="expert-picker-trial__close" type="button" aria-label="Close" data-trial-picker-action="close"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/close.svg" alt="" /></button>

        <header class="expert-picker-trial__intro">
          <h1 id="expert-picker-trial-title">Chose available psychic</h1>
          <p class="expert-picker-trial__entitlement"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/entitlement-star.svg" alt="" /><span>You have 3 FREE minute with a new psychic</span></p>
          <p id="expert-picker-trial-description">The psychic you have chosen is busy now. Select another one<br class="desktop-only" /> and get 3 free minutes.</p>
        </header>

        <div class="expert-picker-trial__carousel" role="radiogroup" aria-label="Trial-eligible psychics">
          <button class="trial-picker-arrow trial-picker-arrow--previous" type="button" aria-label="Previous expert" data-trial-picker-action="previous"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/previous.svg" alt="" /></button>
          <div class="trial-picker-track">
            <button class="trial-expert-choice is-before" type="button" role="radio" aria-checked="false" tabindex="-1" data-trial-picker-card data-index="0" data-expert-id="medium-mark">
              <span class="trial-expert-choice__portrait"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/portrait-01.png" alt="Medium Mark" /><span class="trial-expert-choice__online">Online</span></span>
              <span class="trial-expert-choice__copy"><strong>Medium Mark</strong><small>Love &amp; Relationship expert</small><span class="trial-expert-choice__rating"><b>4.8</b><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/rating-star-small.svg" alt="" /><em>1,211 reviews</em></span></span>
            </button>
            <button class="trial-expert-choice is-active" type="button" role="radio" aria-checked="true" tabindex="0" data-trial-picker-card data-index="1" data-expert-id="margo-lover">
              <span class="trial-expert-choice__portrait"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/portrait-02.png" alt="Margo Lover" /><span class="trial-expert-choice__online">Online</span></span>
              <span class="trial-expert-choice__copy"><strong>Margo Lover</strong><small>Love &amp; Relationship expert</small><span class="trial-expert-choice__rating"><b>4.8</b><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/rating-star-large.svg" alt="" /><em>1,211 reviews</em></span></span>
            </button>
            <button class="trial-expert-choice is-after" type="button" role="radio" aria-checked="false" tabindex="-1" data-trial-picker-card data-index="2" data-expert-id="victoriya-bikrets">
              <span class="trial-expert-choice__portrait"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/portrait-03.png" alt="Victoriya Bikrets" /><span class="trial-expert-choice__online">Online</span></span>
              <span class="trial-expert-choice__copy"><strong>Victoriya Bikrets…</strong><small>Love &amp; Relationship expert</small><span class="trial-expert-choice__rating"><b>4.8</b><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/rating-star-small.svg" alt="" /><em>1,211 reviews</em></span></span>
            </button>
          </div>
          <button class="trial-picker-arrow trial-picker-arrow--next" type="button" aria-label="Next expert" data-trial-picker-action="next"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/next.svg" alt="" /></button>
        </div>

        <button class="expert-picker-trial__submit" type="button" data-trial-picker-action="commit-intent"><span>Start chat</span><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-trial/chat.svg" alt="" /></button>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-trial-picker-live></p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/expert-picker-trial.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
