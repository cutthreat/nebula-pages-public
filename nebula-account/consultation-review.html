<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Margo Lover — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/consultation-review.css" />
</head>
<body>
  <button class="sr-only" type="button" data-completed-action="write-review">Write a review</button>
  <main class="consultation-review"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="review_composer"
        data-static-projection="true"
        data-session-id="fixture-completed-session"
        data-session-version="fixture-v1"
        data-expert-id="fixture-expert"
        data-rating-draft="3"
        data-nebula-consultation-review>
    <section class="consultation-review__frame"
             data-node-id="1397:38652"
             data-node-id-992="1407:30548"
             data-node-id-768="1407:30575"
             data-node-id-576="1407:30602"
             data-node-id-320="1407:30629">
      <article class="consultation-review__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="consultation-review-title"
               aria-describedby="consultation-review-description">
        <div class="consultation-review__toolbar">
          <button class="consultation-review__close" type="button" aria-label="Close review composer" data-review-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/consultation-review/close.svg" alt="" />
          </button>
        </div>

        <div class="consultation-review__body">
          <header class="consultation-review__heading">
            <h1 id="consultation-review-title">Rate Margo Lover's consultation</h1>
            <p id="consultation-review-description">Describe your experience with Margo in detail to help others make their choice</p>
          </header>

          <textarea class="consultation-review__field"
                    aria-label="Review text"
                    placeholder="Write a review"
                    data-review-draft></textarea>

          <div class="consultation-review__actions">
            <button class="consultation-review__send" type="button" data-review-action="submit-intent">
              <span>Send a request</span>
            </button>
            <button class="consultation-review__complain" type="button" data-review-action="complain">Complain about an expert</button>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-review-live>Review composer fixture. Nothing is submitted or published.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/consultation-review.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
