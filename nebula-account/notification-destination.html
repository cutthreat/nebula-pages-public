<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notification destination — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/notification-destination.css" />
</head>
<body>
  <button class="sr-only" type="button" data-notify-destination-anchor>Notification destination status</button>
  <main class="notify-destination"
        data-route-owner="/nebula-account/chatroom/notify"
        data-c76-state="notification_channel_selection"
        data-static-projection="true"
        data-flow-id="fixture-notification-flow"
        data-flow-version="fixture-v1"
        data-nebula-notify-destination>
    <section class="notify-destination__frame"
             data-node-id="1497:46875"
             data-node-id-992="1497:46915"
             data-node-id-768="1497:46955"
             data-node-id-576="1497:46995"
             data-node-id-320="1497:47035">
      <article class="notify-destination__modal" role="dialog" aria-modal="true" aria-labelledby="notify-destination-title">
        <div class="notify-destination__toolbar">
          <button class="notify-destination__close" type="button" aria-label="Close notification destination" data-notify-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/notification-destination/close.svg" alt="" />
          </button>
        </div>
        <div class="notify-destination__body">
          <div class="notify-destination__head">
            <img class="notify-destination__bell" src="yii2/modules/nebulaAccount/resources/images/notification-destination/bell.svg" alt="" />
            <h1 id="notify-destination-title" tabindex="-1">How should we notify you?</h1>
          </div>
          <div class="notify-destination__options" role="group" aria-labelledby="notify-destination-title">
            <button class="notify-destination__option is-selected" type="button" role="checkbox" aria-checked="true" data-channel="email"><span>Email</span><img src="yii2/modules/nebulaAccount/resources/images/notification-destination/selected.svg" alt="" /></button>
            <button class="notify-destination__option" type="button" role="checkbox" aria-checked="false" data-channel="sms"><span>SMS (text message)</span><img src="yii2/modules/nebulaAccount/resources/images/notification-destination/unselected.svg" alt="" /></button>
            <button class="notify-destination__option" type="button" role="checkbox" aria-checked="false" data-channel="telegram"><span>Telegram</span><img src="yii2/modules/nebulaAccount/resources/images/notification-destination/unselected.svg" alt="" /></button>
          </div>
          <button class="notify-destination__next" type="button" data-notify-action="next">Next</button>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-notify-live>Notification destination is a local static fixture. No preference was saved.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/notification-destination.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
