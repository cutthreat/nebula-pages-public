<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout order review — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/checkout-order-review.css" />
</head>
<body>
  <button class="sr-only" type="button" data-checkout-anchor>Upstream funding state</button>
  <main class="checkout-review"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="checkout_order_review"
        data-static-projection="true"
        data-order-copy="fixture-only"
        data-checkout-id="fixture-checkout"
        data-checkout-version="fixture-checkout-v1"
        data-package-id="fixture-package"
        data-package-version="fixture-package-v1"
        data-selected-method-id="fixture-saved-card"
        data-selected-method-version="fixture-saved-card-v1"
        data-submit-idempotency-key="fixture-checkout-submit"
        data-chooser-idempotency-key="fixture-saved-method-chooser"
        data-nebula-checkout-review>
    <section class="checkout-review__frame"
             data-node-id="1397:34820"
             data-node-id-992="1405:40776"
             data-node-id-768="1405:40862"
             data-node-id-576="1405:40948"
             data-node-id-320="1405:41034">
      <article class="checkout-review__modal" role="dialog" aria-modal="true" aria-labelledby="checkout-review-title">
        <div class="checkout-review__toolbar">
          <button class="checkout-review__close" type="button" aria-label="Close order details" data-checkout-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-03.svg" alt="" />
          </button>
        </div>

        <div class="checkout-review__body">
          <div class="checkout-review__head">
            <section class="checkout-review__order" aria-label="Order fixture details">
              <h1 id="checkout-review-title" tabindex="-1">Order details:</h1>
              <img class="checkout-review__divider" src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-11.svg" alt="" />
              <div class="checkout-review__line checkout-review__package">
                <span><strong>Package</strong><small>Includes: 350 credits</small></span><b>$24.99</b>
              </div>
              <img class="checkout-review__divider" src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-11.svg" alt="" />
              <div class="checkout-review__line"><strong>Total:</strong><b>$24.99</b></div>
              <img class="checkout-review__divider" src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-11.svg" alt="" />
            </section>

            <section class="checkout-review__payment" aria-labelledby="checkout-payment-title">
              <h2 id="checkout-payment-title">Choose payment method</h2>
              <div class="checkout-review__methods" role="radiogroup" aria-labelledby="checkout-payment-title">
                <div class="checkout-review__providers">
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-method-id="fixture-paypal" data-method-version="fixture-paypal-v1" data-method-type="paypal" aria-label="PayPal">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-05.svg" alt="PayPal" />
                  </button>
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-method-id="fixture-apple-pay" data-method-version="fixture-apple-v1" data-method-type="apple_pay" aria-label="Apple Pay">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-08.svg" alt="Apple Pay" />
                  </button>
                  <button type="button" role="radio" aria-checked="false" tabindex="-1" data-method-id="fixture-credit-card" data-method-version="fixture-credit-card-v1" data-method-type="credit_card" aria-label="Credit Card">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-04.svg" alt="" /><span>Credit Card</span>
                  </button>
                </div>
                <div class="checkout-review__saved-row">
                  <button class="checkout-review__saved" type="button" role="radio" aria-checked="true" tabindex="0" data-method-id="fixture-saved-card" data-method-version="fixture-saved-card-v1" data-method-type="saved_card" aria-label="Saved Mastercard 5457 08XX XXXX 1075">
                    <span><img class="checkout-review__selected" src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-06.svg" alt="" /><img class="checkout-review__mastercard" src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-07.svg" alt="Mastercard" /></span>
                    <b>5457 08XX XXXX 1075</b>
                  </button>
                  <button class="checkout-review__saved-chooser" type="button" aria-label="Choose another saved payment method" data-checkout-action="saved-chooser">
                    <img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-12.svg" alt="" />
                  </button>
                </div>
              </div>
            </section>
          </div>

          <button class="checkout-review__buy" type="button" data-checkout-action="submit">Buy</button>

          <div class="checkout-review__security" aria-label="Guaranteed security payments, source fixture">
            <img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-10.svg" alt="" /><span>Guaranteed security payments</span>
          </div>

          <div class="checkout-review__networks" aria-label="Supported payment networks, source fixture">
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-07.svg" alt="Mastercard" /></span>
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-14.svg" alt="Visa" /></span>
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-13.svg" alt="American Express" /></span>
            <span><img src="yii2/modules/nebulaAccount/resources/images/checkout-order-review/asset-09.svg" alt="Discover" /></span>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-checkout-live>All order, card and security values are static C76 fixtures; checkout remains host-owned.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/checkout-order-review.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
