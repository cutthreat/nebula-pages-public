<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email notification</title>
<link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/notification-delivery.css">
</head>
<body>
<main class="delivery delivery--email" data-static-projection="true" data-c76-state="notification_email_destination">
<span data-origin-trigger tabindex="-1">
</span>
<section class="delivery__modal" role="dialog" aria-modal="true" aria-labelledby="delivery-email-title">
<button class="delivery__close" type="button" aria-label="Close">
<img src="yii2/modules/nebulaAccount/resources/images/fast-batch-03/g27-close.svg" alt="">
</button>
<img class="delivery__hero" src="yii2/modules/nebulaAccount/resources/images/fast-batch-03/g27-mail.svg" alt="">
<h1 id="delivery-email-title">We’ll notify you at:</h1>
<input class="delivery__field" aria-readonly="true" aria-label="Email notification destination" readonly placeholder="Enter your email to be notified">
<p>You’ll get an email when your psychic is online</p>
<button class="delivery__primary" type="button" data-intent="email">Done</button>
</section>
</main>
<script src="yii2/modules/nebulaAccount/resources/js/notification-delivery.js">
</script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
