<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One-click top up — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/one-click-top-up.css" />
</head>
<body>
  <button class="sr-only" type="button" data-one-click-anchor>Paused chat funding status</button>
  <main class="one-click"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="one_click_topup_offer"
        data-static-projection="true"
        data-commercial-copy="fixture-only"
        data-session-id="fixture-session"
        data-session-version="fixture-session-v1"
        data-offer-id="fixture-one-click-offer"
        data-offer-version="fixture-offer-v1"
        data-package-id="fixture-package"
        data-package-version="fixture-package-v1"
        data-idempotency-key="fixture-one-click-request"
        data-nebula-one-click>
    <section class="one-click__frame"
             data-node-id="1380:30767"
             data-node-id-992="1407:29784"
             data-node-id-768="1407:29816"
             data-node-id-576="1407:29848"
             data-node-id-320="1407:29880">
      <article class="one-click__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="one-click-title"
               aria-describedby="one-click-subtitle one-click-timer-copy">
        <div class="one-click__toolbar">
          <button class="one-click__close" type="button" aria-label="Close one-click top up" data-one-click-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/one-click-top-up/close.svg" alt="" />
          </button>
        </div>

        <div class="one-click__body">
          <div class="one-click__head">
            <header class="one-click__heading">
              <h1 id="one-click-title" tabindex="-1">You’ve run out of credits</h1>
              <p id="one-click-subtitle">Refill credits in 1 click</p>
            </header>

            <div class="one-click__timer" id="one-click-timer-copy" aria-label="46 seconds, static C76 fixture">
              <img class="one-click__timer-base" src="yii2/modules/nebulaAccount/resources/images/one-click-top-up/timer-base.svg" alt="" />
              <img class="one-click__timer-progress" src="yii2/modules/nebulaAccount/resources/images/one-click-top-up/timer-progress.svg" alt="" />
              <span><strong>46</strong><small>seconds</small></span>
            </div>
          </div>

          <div class="one-click__actions">
            <button class="one-click__primary" type="button" data-one-click-action="purchase">Get 120 credits for $9,99</button>
            <button class="one-click__decline" type="button" data-one-click-action="decline">I don’t want to continue chatting</button>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-one-click-live>The displayed price, credits and timer are static C76 fixtures only.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/one-click-top-up.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
