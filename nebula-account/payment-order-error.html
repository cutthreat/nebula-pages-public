<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment processing error — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/payment-order-error.css" />
</head>
<body>
  <button class="sr-only" type="button" data-payment-error-anchor>Upstream payment state</button>
  <main class="payment-error"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="payment_order_error"
        data-static-projection="true"
        data-order-id="fixture-order"
        data-order-version="fixture-order-v1"
        data-attempt-id="fixture-attempt"
        data-attempt-version="fixture-attempt-v1"
        data-upstream-context="fixture-chat-funding"
        data-redacted-reference="fixture-redacted-reference"
        data-idempotency-key="fixture-payment-recovery"
        data-nebula-payment-error>
    <section class="payment-error__frame"
             data-node-id="1380:31206"
             data-node-id-992="1407:29912"
             data-node-id-768="1407:29944"
             data-node-id-576="1407:29976"
             data-node-id-320="1407:30008">
      <article class="payment-error__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="payment-error-title"
               aria-describedby="payment-error-retry payment-error-support-copy">
        <div class="payment-error__toolbar">
          <button class="payment-error__close" type="button" aria-label="Close payment error" data-payment-error-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/payment-order-error/asset-02.svg" alt="" />
          </button>
        </div>

        <div class="payment-error__body">
          <div class="payment-error__head">
            <div class="payment-error__ring" aria-hidden="true">
              <img src="yii2/modules/nebulaAccount/resources/images/payment-order-error/asset-03.svg" alt="" />
              <img src="yii2/modules/nebulaAccount/resources/images/payment-order-error/asset-05.svg" alt="" />
              <span>!</span>
            </div>
            <h1 id="payment-error-title" tabindex="-1">An error processing your order</h1>
          </div>

          <div class="payment-error__copy">
            <p id="payment-error-retry">Please try again</p>
            <p id="payment-error-support-copy">If you have any difficulties with solving this problem, do not hesitate to contact <button type="button" data-payment-error-action="support">our support.</button></p>
          </div>

          <button class="payment-error__primary" type="button" data-payment-error-action="alternate">Try another method</button>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-payment-error-live>The payment outcome and every recovery action remain host-owned.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/payment-order-error.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
