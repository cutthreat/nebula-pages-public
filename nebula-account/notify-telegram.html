<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram notification</title>
<link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/notification-delivery.css">
</head>
<body>
<main class="delivery delivery--telegram" data-static-projection="true" data-c76-state="notification_telegram_destination">
<span data-origin-trigger tabindex="-1">
</span>
<section class="delivery__modal" role="dialog" aria-modal="true" aria-labelledby="delivery-telegram-title">
<button class="delivery__close" type="button" aria-label="Close">
<img src="yii2/modules/nebulaAccount/resources/images/fast-batch-03/g28-close.svg" alt="">
</button>
<img class="delivery__hero" src="yii2/modules/nebulaAccount/resources/images/fast-batch-03/g28-telegram.svg" alt="">
<h1 id="delivery-telegram-title">Enter your number</h1>
<p>You will receive a message on Telegram to this number when your psychic is online.</p>
<div class="delivery__phone" aria-label="Phone number fixture">
<img src="yii2/modules/nebulaAccount/resources/images/fast-batch-03/g28-country.svg" alt="">
<span>+93 34 542 6546</span>
</div>
<div class="delivery__consent">
<img src="yii2/modules/nebulaAccount/resources/images/fast-batch-03/g28-check.svg" alt="">
<small>By clicking, you consent to receive messages from Neuro. Terms and rates may apply. You may find the privacy here. opt-out anytime.</small>
</div>
<button class="delivery__primary" type="button" data-intent="telegram">Confirm</button>
</section>
</main>
<script src="yii2/modules/nebulaAccount/resources/js/notification-delivery.js">
</script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
