<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Top up to start — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/top-up-to-start.css" />
</head>
<body>
  <button class="sr-only" type="button" data-funding-opener>Open top up selection</button>
  <button class="sr-only" type="button" data-chat-anchor>Return to chat</button>
  <main class="top-up-start"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="pre_start_funding_required"
        data-static-projection="true"
        data-commercial-copy="fixture-only"
        data-intent-id="fixture-pre-start-intent"
        data-intent-version="fixture-v1"
        data-nebula-top-up-start>
    <section class="top-up-start__frame"
             data-node-id="1397:34370"
             data-node-id-992="1405:40560"
             data-node-id-768="1405:40614"
             data-node-id-576="1405:40668"
             data-node-id-320="1405:40722">
      <article class="top-up-start__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="top-up-start-title"
               aria-describedby="top-up-start-subtitle">
        <div class="top-up-start__toolbar">
          <button class="top-up-start__back" type="button" data-funding-action="back">
            <img src="yii2/modules/nebulaAccount/resources/images/top-up-to-start/back.svg" alt="" />
            <span>Go back</span>
          </button>
          <button class="top-up-start__close" type="button" aria-label="Close top up selection" data-funding-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/top-up-to-start/close.svg" alt="" />
          </button>
        </div>

        <div class="top-up-start__body">
          <header class="top-up-start__heading">
            <h1 id="top-up-start-title" tabindex="-1">Top up your balance<br />to start chatting</h1>
            <p id="top-up-start-subtitle">Margo Lover is already waiting for you!</p>
          </header>

          <div class="top-up-start__packages" role="radiogroup" aria-label="Credit package fixture">
            <div class="top-up-start__best-wrap">
              <span class="top-up-start__best-label">BEST VALUE</span>
              <button class="top-up-start__package" type="button" role="radio" aria-checked="false" tabindex="-1"
                      data-package-id="fixture-1800" data-package-version="fixture-v1">
                <span class="top-up-start__package-copy">
                  <strong>1800 credits</strong>
                  <small>+600 extra credits</small>
                </span>
                <b>$ 99.99</b>
              </button>
            </div>
            <button class="top-up-start__package is-selected" type="button" role="radio" aria-checked="true" tabindex="0"
                    data-package-id="fixture-350" data-package-version="fixture-v1">
              <span class="top-up-start__package-copy">
                <strong>350 credits</strong>
                <small>+50 extra credits</small>
              </span>
              <b>$ 24.99</b>
            </button>
            <button class="top-up-start__package" type="button" role="radio" aria-checked="false" tabindex="-1"
                    data-package-id="fixture-120" data-package-version="fixture-v1">
              <span class="top-up-start__package-copy"><strong>120 credits</strong></span>
              <b>$ 9.99</b>
            </button>
          </div>

          <button class="top-up-start__pay" type="button" data-funding-action="checkout">Pay and continue</button>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-funding-live>The displayed packages are static C76 fixtures only.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/top-up-to-start.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
