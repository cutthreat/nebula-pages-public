<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expert picker — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/expert-picker-generic.css" />
</head>
<body>
  <main class="expert-picker-generic" data-route-owner="/nebula-account/chatroom" data-c76-state="expert_picker_generic" data-static-projection="true" data-backend-capability="unbound" data-nebula-expert-picker>
    <section class="expert-picker-generic__frame" data-node-id="1397:33234" data-node-id-992="1405:39912" data-node-id-768="1405:40012" data-node-id-576="1405:40112" data-node-id-320="1405:40212">
      <article class="expert-picker-generic__modal" role="dialog" aria-modal="true" aria-labelledby="expert-picker-title" aria-describedby="expert-picker-description">
        <button class="expert-picker-generic__close" type="button" aria-label="Close" data-picker-action="close"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-04.svg" alt="" /></button>
        <header class="expert-picker-generic__intro">
          <h1 id="expert-picker-title">We found psychics<br /> matching your request</h1>
          <p id="expert-picker-description">Select an expert for relationship consultation. We’ll save<br class="desktop-only" /> your request and move it to the next step.</p>
        </header>

        <div class="expert-picker-generic__carousel" role="radiogroup" aria-label="Available psychics">
          <button class="picker-arrow picker-arrow--previous" type="button" aria-label="Previous expert" data-picker-action="previous"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-09.svg" alt="" /></button>
          <div class="picker-track">
            <button class="expert-choice is-before" type="button" role="radio" aria-checked="false" tabindex="-1" data-picker-card data-index="0" data-expert-id="medium-mark">
              <span class="expert-choice__portrait"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/portrait-01.jpg" alt="Medium Mark" /><span class="expert-choice__online">Online</span></span>
              <span class="expert-choice__copy"><strong>Medium Mark</strong><small>Love &amp; Relationship expert</small><span class="expert-choice__rating"><b>4.8</b><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-11.svg" alt="" /><em>1,211 reviews</em></span></span>
            </button>
            <button class="expert-choice is-active" type="button" role="radio" aria-checked="true" tabindex="0" data-picker-card data-index="1" data-expert-id="margo-lover">
              <span class="expert-choice__portrait"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/portrait-04.png" alt="Margo Lover" /><span class="expert-choice__online">Online</span></span>
              <span class="expert-choice__copy"><strong>Margo Lover</strong><small>Love &amp; Relationship expert</small><span class="expert-choice__rating"><b>4.8</b><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-05.svg" alt="" /><em>1,211 reviews</em></span></span>
            </button>
            <button class="expert-choice is-after" type="button" role="radio" aria-checked="false" tabindex="-1" data-picker-card data-index="2" data-expert-id="victoriya-bikrets">
              <span class="expert-choice__portrait"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/portrait-02.jpg" alt="Victoriya Bikrets" /><span class="expert-choice__online">Online</span></span>
              <span class="expert-choice__copy"><strong>Victoriya Bikrets…</strong><small>Love &amp; Relationship expert</small><span class="expert-choice__rating"><b>4.8</b><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-11.svg" alt="" /><em>1,211 reviews</em></span></span>
            </button>
          </div>
          <button class="picker-arrow picker-arrow--next" type="button" aria-label="Next expert" data-picker-action="next"><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-10.svg" alt="" /></button>
        </div>

        <button class="expert-picker-generic__submit" type="button" data-picker-action="commit-intent"><span>Start chat</span><img src="yii2/modules/nebulaAccount/resources/images/expert-picker-generic/vector-12.svg" alt="" /></button>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-picker-live></p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/expert-picker-generic.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
