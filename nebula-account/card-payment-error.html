<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card payment error — Neuro</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="yii2/modules/nebulaAccount/resources/css/card-payment-error.css" />
</head>
<body>
  <button class="sr-only" type="button" data-card-error-anchor>Upstream payment state</button>
  <main class="card-error"
        data-route-owner="/nebula-account/chatroom"
        data-c76-state="card_payment_error"
        data-static-projection="true"
        data-method-copy="fixture-only"
        data-order-id="fixture-order"
        data-order-version="fixture-order-v1"
        data-attempt-id="fixture-attempt"
        data-attempt-version="fixture-attempt-v1"
        data-upstream-context="fixture-chat-funding"
        data-redacted-reference="fixture-redacted-reference"
        data-wallet-method-id="fixture-apple-pay"
        data-wallet-method-version="fixture-wallet-v1"
        data-card-method-id="fixture-card-token"
        data-card-method-version="fixture-card-v1"
        data-wallet-idempotency-key="fixture-wallet-request"
        data-card-idempotency-key="fixture-card-request"
        data-chooser-idempotency-key="fixture-chooser-request"
        data-support-idempotency-key="fixture-support-request"
        data-nebula-card-error>
    <section class="card-error__frame"
             data-node-id="1488:44300"
             data-node-id-992="1488:44327"
             data-node-id-768="1488:44354"
             data-node-id-576="1488:44381"
             data-node-id-320="1488:44408">
      <article class="card-error__modal"
               role="dialog"
               aria-modal="true"
               aria-labelledby="card-error-title"
               aria-describedby="card-error-retry card-error-support-copy">
        <div class="card-error__toolbar">
          <button class="card-error__close" type="button" aria-label="Close card payment error" data-card-error-action="dismiss">
            <img src="yii2/modules/nebulaAccount/resources/images/card-payment-error/close.svg" alt="" />
          </button>
        </div>

        <div class="card-error__body">
          <div class="card-error__head">
            <div class="card-error__ring" aria-hidden="true">
              <img src="yii2/modules/nebulaAccount/resources/images/card-payment-error/ring-inner.svg" alt="" />
              <img src="yii2/modules/nebulaAccount/resources/images/card-payment-error/ring-outer.svg" alt="" />
              <span>!</span>
            </div>
            <div class="card-error__copy">
              <h1 id="card-error-title" tabindex="-1">An error processing your order</h1>
              <div class="card-error__message">
                <p id="card-error-retry">Please try again</p>
                <p id="card-error-support-copy">If you have any difficulties with solving this problem, do not hesitate to contact <a role="button" tabindex="0" data-card-error-action="support">our<br class="card-error__support-break" /> support.</a></p>
              </div>
            </div>
          </div>

          <div class="card-error__actions">
            <button class="card-error__method card-error__apple" type="button" aria-label="Use Apple Pay" data-card-error-action="wallet">
              <img src="yii2/modules/nebulaAccount/resources/images/card-payment-error/card.svg" alt="" />
            </button>
            <button class="card-error__method card-error__card" type="button" aria-label="Use saved Mastercard ending 1075, static fixture" data-card-error-action="saved-method">
              <span class="card-error__brand"><img src="yii2/modules/nebulaAccount/resources/images/card-payment-error/mastercard.svg" alt="" /><i></i></span>
              <span class="card-error__masked"><img src="yii2/modules/nebulaAccount/resources/images/card-payment-error/apple-pay-tile.svg" alt="" />**** 1075</span>
            </button>
            <button class="card-error__primary" type="button" data-card-error-action="chooser">Try another method</button>
          </div>
        </div>
      </article>
    </section>
    <p class="sr-only" aria-live="polite" data-card-error-live>The displayed wallet and masked card are static C76 fixtures; payment recovery remains host-owned.</p>
  </main>
  <script src="yii2/modules/nebulaAccount/resources/js/card-payment-error.js"></script>
<script src="fixture-bootstrap.js"></script>
</body>
</html>
